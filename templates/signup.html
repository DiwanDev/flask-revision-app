{% extends "base.html" %}

{% block title %}
    Sign Up
{% endblock %}

{% block content %}

<div class="signup-page">

    <div class="signup-box">

        <h1>Create Account</h1>

        {% if message %}
            <p class="form-message">
                {{ message }}
            </p>
        {% endif %}

        <form
            action="{{ url_for('signup') }}"
            method="POST"
        >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                minlength="3"
                maxlength="20"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                minlength="6"
                maxlength="50"
                required
            >

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Enter password again"
                minlength="6"
                maxlength="50"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p>
            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
