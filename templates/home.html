{% extends "base.html" %}

{% block title %}
    Home
{% endblock %}

{% block content %}

<div class="home-page">

    <div class="home-box">

        <h1>
            Welcome, {{ username }}
        </h1>

        <p>
            You have logged in successfully.
        </p>

        <div class="home-actions">

            <a href="{{ url_for('products') }}">
                View Products
            </a>

            <a href="{{ url_for('cart') }}">
                View Cart
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </div>

</div>

{% endblock %}
